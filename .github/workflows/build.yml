name: Build Custom RoundSync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build via Makefile
        run: |
          # Mengeksekusi Make target 'build' dengan variabel kustom
          make build \
            RCLONE_REPO="https://github.com/gulp79/rclone-extra.git" \
            RCLONE_BRANCH="master" \
            BUILD_NAME="RoundSync-Extra"
          
      - name: Upload APK Artifact (Hanya arm64)
        uses: actions/upload-artifact@v4
        with:
          name: RoundSync-Extra-APK
          # Memfilter agar hanya APK untuk HP modern yang diupload
          path: output/RoundSync-Extra/*arm64-v8a*.apk

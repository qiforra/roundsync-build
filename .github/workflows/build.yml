name: Build Custom RoundSync

on:
  workflow_dispatch: # Memungkinkan kamu menjalankan build secara manual melalui tombol

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Build via Docker Compose
        env:
          RCLONE_REPO: "https://github.com/gulp79/rclone-extra.git"
          RCLONE_BRANCH: "master"
          BUILD_NAME: "RoundSync-Extra"
 run: |
          # Menjalankan docker compose menggunakan konfigurasi yang ada di repo
          docker compose up --build
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoundSync-Extra-APK
          # Mengambil file APK yang dihasilkan oleh build.sh dan ditaruh di folder output
          path: output/RoundSync-Extra/*.apk

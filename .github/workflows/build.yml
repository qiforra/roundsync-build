name: Build Custom RoundSync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Build via Docker Compose
        env:
          RCLONE_REPO: "https://github.com/gulp79/rclone-extra.git"
          RCLONE_BRANCH: "master"
          BUILD_NAME: "RoundSync-Extra"
        run: |
          docker compose up --build
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoundSync-Extra-APK
          path: output/RoundSync-Extra/*.apk
